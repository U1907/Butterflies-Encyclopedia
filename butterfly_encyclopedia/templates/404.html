{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-icon">🦋</div>
  <h1 class="error-code">404</h1>
  <h2 class="error-msg">Species Not Found</h2>

  </div>
</div>
{% endblock %}
