  <circle cx="155" cy="420"  r="0.9" fill="#5aad85" opacity="0.15"/>
  <circle cx="350" cy="720"  r="0.7" fill="#5aad85" opacity="0.12"/>
  <circle cx="900" cy="60"   r="0.8" fill="#5aad85" opacity="0.12"/>
  <circle cx="1100" cy="380" r="0.6" fill="#5aad85" opacity="0.11"/>
  <circle cx="1340" cy="520" r="0.9" fill="#5aad85" opacity="0.13"/>
</svg>
