<svg class="bg-svg" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!--
    Enhanced ambient background — drop-in for base.html .bg-svg
    Adds botanical leaf vein texture and gold pollen specks
    to the existing gradient blobs.
  -->
  <defs>
    <radialGradient id="g1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#080f0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#1e2f1a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#080f0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#0f2218" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080f0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="10%" cy="85%" r="38%">
      <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#080f0c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base gradient blobs (original + extra) -->
  <rect width="1440" height="900" fill="url(#g1)"/>
  <rect width="1440" height="900" fill="url(#g2)"/>
  <rect width="1440" height="900" fill="url(#g3)"/>
  <rect width="1440" height="900" fill="url(#g4)"/>

  <!-- ── BOTANICAL LEAF VEINS (top-left cluster) ── -->
  <path d="M80,60 Q130,180 80,310" fill="none" stroke="#3d7a5c" stroke-width="0.6" opacity="0.3"/>
  <path d="M80,140 Q110,136 140,130" fill="none" stroke="#3d7a5c" stroke-width="0.4" opacity="0.25"/>
  <path d="M80,175 Q112,170 148,164" fill="none" stroke="#3d7a5c" stroke-width="0.35" opacity="0.22"/>
  <path d="M80,210 Q114,205 150,198" fill="none" stroke="#3d7a5c" stroke-width="0.3" opacity="0.2"/>
  <path d="M80,248 Q116,242 154,235" fill="none" stroke="#3d7a5c" stroke-width="0.3" opacity="0.18"/>

  <path d="M175,30 Q235,145 175,275" fill="none" stroke="#3d7a5c" stroke-width="0.5" opacity="0.22"/>
  <path d="M175,115 Q210,110 250,104" fill="none" stroke="#3d7a5c" stroke-width="0.35" opacity="0.18"/>
  <path d="M175,158 Q212,152 252,145" fill="none" stroke="#3d7a5c" stroke-width="0.3" opacity="0.16"/>

  <!-- ── BOTANICAL LEAF VEINS (bottom-right cluster) ── -->
  <path d="M1280,620 Q1340,745 1280,870" fill="none" stroke="#3d7a5c" stroke-width="0.55" opacity="0.28"/>
  <path d="M1280,702 Q1314,696 1354,689" fill="none" stroke="#3d7a5c" stroke-width="0.4" opacity="0.22"/>
  <path d="M1280,742 Q1316,736 1358,728" fill="none" stroke="#3d7a5c" stroke-width="0.35" opacity="0.19"/>
  <path d="M1280,784 Q1318,778 1360,770" fill="none" stroke="#3d7a5c" stroke-width="0.3" opacity="0.17"/>

  <path d="M1370,640 Q1420,760 1370,880" fill="none" stroke="#3d7a5c" stroke-width="0.45" opacity="0.2"/>
  <path d="M1370,718 Q1398,712 1428,705" fill="none" stroke="#3d7a5c" stroke-width="0.3" opacity="0.16"/>

  <!-- ── SCATTERED POLLEN / DUST SPECKS (gold) ── -->
  <circle cx="240" cy="95"  r="1"   fill="#c9a227" opacity="0.22"/>
  <circle cx="320" cy="215" r="0.8" fill="#c9a227" opacity="0.18"/>
  <circle cx="125" cy="310" r="1.2" fill="#c9a227" opacity="0.2"/>
  <circle cx="410" cy="140" r="0.7" fill="#c9a227" opacity="0.16"/>
  <circle cx="520" cy="80"  r="0.9" fill="#c9a227" opacity="0.14"/>
  <circle cx="680" cy="820" r="1"   fill="#c9a227" opacity="0.16"/>
  <circle cx="820" cy="870" r="0.8" fill="#c9a227" opacity="0.14"/>
  <circle cx="1050" cy="750" r="1.1" fill="#c9a227" opacity="0.18"/>
  <circle cx="1190" cy="680" r="0.9" fill="#c9a227" opacity="0.16"/>
  <circle cx="1380" cy="820" r="1"   fill="#c9a227" opacity="0.2"/>
  <circle cx="1420" cy="200" r="0.7" fill="#c9a227" opacity="0.14"/>

