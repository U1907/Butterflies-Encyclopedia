<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Butterfly wing glyph">
  <!--
    TYPE 2 — Card / Panel Wing Glyph
    Usage: species-card top accent, stat-card icon, panel header mark
    Scale freely: looks good at 24px–64px
    Replace the 🦋 emoji in .card-butterfly and .logo-icon with this SVG
  -->
  <g transform="translate(32,32)">
    <!-- Left forewing -->
    <path d="M0,-10 C-8,-20 -26,-23 -36,-17 C-43,-13 -42,-5 -35,-1 C-26,4 -8,5 0,2 Z"
          fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left hindwing -->
    <path d="M0,2 C-7,5 -20,10 -26,19 C-31,26 -27,33 -20,34 C-12,35 -4,27 0,19 Z"
          fill="none" stroke="#c9a227" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Left forewing venation -->
    <path d="M0,-5 C-9,-10 -20,-13 -28,-11" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.55"/>
    <path d="M0,-2 C-8,-6 -18,-8 -26,-6" fill="none" stroke="#c9a227" stroke-width="0.4" opacity="0.45"/>
    <!-- Left hindwing eyespot -->
    <ellipse cx="-18" cy="21" rx="4" ry="3.5" fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.5"/>
    <ellipse cx="-18" cy="21" rx="1.5" ry="1.3" fill="#c9a227" opacity="0.55"/>

    <!-- Right forewing (mirror) -->
    <path d="M0,-10 C8,-20 26,-23 36,-17 C43,-13 42,-5 35,-1 C26,4 8,5 0,2 Z"
          fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right hindwing (mirror) -->
    <path d="M0,2 C7,5 20,10 26,19 C31,26 27,33 20,34 C12,35 4,27 0,19 Z"
          fill="none" stroke="#c9a227" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Right forewing venation (mirror) -->
    <path d="M0,-5 C9,-10 20,-13 28,-11" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.55"/>
    <path d="M0,-2 C8,-6 18,-8 26,-6" fill="none" stroke="#c9a227" stroke-width="0.4" opacity="0.45"/>
    <!-- Right hindwing eyespot (mirror) -->
    <ellipse cx="18" cy="21" rx="4" ry="3.5" fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.5"/>
    <ellipse cx="18" cy="21" rx="1.5" ry="1.3" fill="#c9a227" opacity="0.55"/>

    <!-- Body -->
    <ellipse cx="0" cy="11" rx="2" ry="16" fill="#1a3a2a" stroke="#c9a227" stroke-width="0.8"/>

    <!-- Antennae -->
    <path d="M-1.5,-9 C-4,-17 -6,-21 -8,-25" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="-8" cy="-25" r="1.5" fill="#c9a227"/>
    <path d="M1.5,-9 C4,-17 6,-21 8,-25" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="8" cy="-25" r="1.5" fill="#c9a227"/>
  </g>
</svg>
