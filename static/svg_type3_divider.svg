<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="100%" preserveAspectRatio="xMidYMid meet" aria-label="Section divider with wing motif">
  <!--
    TYPE 3 — Section Divider
    Usage: section-header border, hero border-bottom, stat-strip separators
    Width stretches to 100% via CSS; height is fixed at ~48px
    Two variants shown (use whichever fits):
      3A: Full — left rule + central wing glyph + right rule (this file)
      3B: Minimal — just a <line> with center dot, no glyph needed (do inline)
  -->

  <!-- Left rule -->
  <line x1="0" y1="24" x2="348" y2="24" stroke="#c9a227" stroke-width="0.6" opacity="0.3"/>

  <!-- Left dot fade -->
  <circle cx="348" cy="24" r="1.5" fill="#c9a227" opacity="0.45"/>
  <circle cx="360" cy="24" r="0.9" fill="#c9a227" opacity="0.3"/>
  <circle cx="370" cy="24" r="0.6" fill="#c9a227" opacity="0.2"/>

  <!-- Central wing glyph (tiny, centered at x=400) -->
  <g transform="translate(400,24) scale(0.28)">
    <!-- Left forewing -->
    <path d="M0,-30 C-20,-54 -65,-58 -90,-44 C-105,-34 -102,-14 -84,-3 C-64,10 -22,12 0,4 Z"
          fill="none" stroke="#c9a227" stroke-width="2" opacity="0.8"/>
    <!-- Left hindwing -->
    <path d="M0,4 C-18,12 -50,24 -64,45 C-74,60 -66,76 -52,78 C-33,80 -10,64 0,45 Z"
          fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.7"/>
    <!-- Right forewing -->
    <path d="M0,-30 C20,-54 65,-58 90,-44 C105,-34 102,-14 84,-3 C64,10 22,12 0,4 Z"
          fill="none" stroke="#c9a227" stroke-width="2" opacity="0.8"/>
    <!-- Right hindwing -->
    <path d="M0,4 C18,12 50,24 64,45 C74,60 66,76 52,78 C33,80 10,64 0,45 Z"
          fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.7"/>
    <!-- Left venation -->
    <path d="M0,-12 C-18,-22 -42,-28 -60,-24" fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.45"/>
    <!-- Right venation -->
    <path d="M0,-12 C18,-22 42,-28 60,-24" fill="none" stroke="#c9a227" stroke-width="0.7" opacity="0.45"/>
    <!-- Body -->
    <ellipse cx="0" cy="24" rx="3.5" ry="42" fill="#1a3a2a" stroke="#c9a227" stroke-width="1"/>
    <!-- Antennae -->
    <path d="M-2,-26 C-6,-44 -10,-54 -14,-63" fill="none" stroke="#c9a227" stroke-width="1" stroke-linecap="round"/>
    <circle cx="-14" cy="-63" r="2.5" fill="#c9a227"/>
    <path d="M2,-26 C6,-44 10,-54 14,-63" fill="none" stroke="#c9a227" stroke-width="1" stroke-linecap="round"/>
    <circle cx="14" cy="-63" r="2.5" fill="#c9a227"/>
  </g>

  <!-- Right dot fade -->
  <circle cx="430" cy="24" r="0.6" fill="#c9a227" opacity="0.2"/>
  <circle cx="440" cy="24" r="0.9" fill="#c9a227" opacity="0.3"/>
  <circle cx="452" cy="24" r="1.5" fill="#c9a227" opacity="0.45"/>

  <!-- Right rule -->
  <line x1="452" y1="24" x2="800" y2="24" stroke="#c9a227" stroke-width="0.6" opacity="0.3"/>
</svg>
